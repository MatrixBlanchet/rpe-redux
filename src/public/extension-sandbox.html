<!-- Sandboxed Extension runtime. The opaque-origin iframe loads this fixed
     document; package code is sent over the message bridge as a blob module.
     A code cell runs in one classic blob worker created here, so the iframe
     stays responsive and can terminate a cell that never returns. The CSP has
     no network, frames, or host access; only blob workers are enabled. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' blob:; connect-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; worker-src 'self' blob:; child-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; navigate-to 'none'"
    />
    <title>Extension sandbox</title>
  </head>
  <body>
    <script>
      (() => {
        "use strict";

        const token = new URL(location.href).searchParams.get("token") ?? "";
        const pending = new Map();
        const callbacks = new Map();
        const cleanups = new Set();
        const controller = new AbortController();
        const nativeSetTimeout = globalThis.setTimeout.bind(globalThis);
        const nativeClearTimeout = globalThis.clearTimeout.bind(globalThis);
        let nextId = 1;
        let nextTimerId = 1;
        const timeouts = new Map();
        const intervals = new Map();
        const animationFrames = new Map();
        let port = null;
        let disposed = false;
        let payload = null;
        let cellWorker = null;
        let cellWorkerTimer = 0;
        let cellWorkerUrl = "";
        let cellSourceUrl = "";
        let cellStartedAt = 0;
        let cellFinished = false;
        let cellLogs = [];
        const cellPending = new Map();
        const cellCallbackIds = new Map();
        const CELL_TIMEOUT_DEFAULT_MS = 10_000;
        const CELL_TIMEOUT_MAX_MS = 20_000;
        const CELL_LOG_LIMIT = 200;
        // WebRTC, WebTransport, and media recording do not pass through
        // `connect-src`; capture entries would also expose host devices to
        // package code. The shield installs these before any package module
        // loads and keeps each name non-configurable and non-writable.
        const DENIED_WEBRTC_GLOBALS = [
          "RTCPeerConnection",
          "webkitRTCPeerConnection",
          "RTCDataChannel",
          "WebTransport",
          "MediaRecorder",
        ];
        // Navigator capture entry points. `mediaDevices` is denied as a whole;
        // the legacy callbacks are denied as functions.
        const DENIED_NAVIGATOR_MEMBERS = ["getUserMedia", "webkitGetUserMedia", "mediaDevices"];

        /**
         * Removes the host IPC primitives from the package realm before any
         * package module loads. Tauri injects `window.ipc` and
         * `__TAURI_INTERNALS__` as non-configurable properties, so they cannot
         * be deleted; both ultimately call `window.chrome.webview.postMessage`,
         * which is replaced here with a frozen deny object. The replacement and
         * `window.external` are made non-configurable so package code cannot
         * restore the original host objects. The remaining entries stay exposed
         * but inert because every path reaches the denied webview.
         */
        function shieldHostIpc() {
          const deny = () => {
            throw new Error("Extension sandbox cannot access host IPC");
          };
          const webview = Object.freeze({
            postMessage: deny,
            postMessageWithAdditionalObjects: deny,
            releaseBuffer: deny,
            addEventListener: deny,
            removeEventListener: deny,
            dispatchEvent: deny,
          });
          const chrome = window.chrome;
          const facade = {};
          if (chrome && typeof chrome === "object") {
            for (const key of ["loadTimes", "csi", "app"]) {
              try {
                if (key in chrome) facade[key] = chrome[key];
              } catch {
                // A host member that throws is not needed by the sandbox.
              }
            }
          }
          facade.webview = webview;
          Object.freeze(facade);
          try {
            Object.defineProperty(window, "chrome", {
              value: facade,
              writable: false,
              configurable: false,
              enumerable: true,
            });
          } catch {
            try {
              Object.defineProperty(chrome, "webview", {
                value: webview,
                writable: false,
                configurable: false,
                enumerable: true,
              });
              Object.freeze(chrome);
            } catch {
              // A host that cannot replace its chrome object keeps the
              // remaining layers: CSP, opaque origin, and the host navigation
              // guard.
            }
          }
          try {
            Object.defineProperty(window, "external", {
              value: Object.freeze({}),
              writable: false,
              configurable: false,
              enumerable: true,
            });
          } catch {
            // A host-defined external object stays as it is.
          }
          try {
            Object.defineProperty(window, "__TAURI__", {
              value: undefined,
              writable: false,
              configurable: false,
              enumerable: false,
            });
          } catch {
            // An existing facade is already outside the package contract.
          }
          try {
            Object.defineProperty(window, "__TAURI_EVENT_PLUGIN_INTERNALS__", {
              value: Object.freeze({}),
              writable: false,
              configurable: false,
              enumerable: false,
            });
          } catch {
            // The event internals are optional and route through invoke.
          }
          try {
            Object.freeze(window.__TAURI_INTERNALS__);
            Object.freeze(window.__TAURI_INTERNALS__?.plugins);
            Object.freeze(window.ipc);
          } catch {
            // Freezing is best effort; the webview facade is the enforcement.
          }
          // A future host that makes the injected properties configurable would
          // expose these names again after a delete; the prototype getters keep
          // the names unusable even then.
          for (const name of ["ipc", "__TAURI_INTERNALS__"]) {
            try {
              Object.defineProperty(Window.prototype, name, {
                configurable: false,
                enumerable: false,
                get() {
                  throw new Error("Extension sandbox cannot access host IPC");
                },
              });
            } catch {
              // An existing prototype entry is left as it is.
            }
          }
          try {
            Object.defineProperty(window, "open", {
              value: deny,
              writable: false,
              configurable: false,
              enumerable: true,
            });
          } catch {
            // A non-configurable open stays as it is.
          }
          // Tauri's custom-protocol IPC starts with fetch; a synchronous throw
          // turns a package invoke into a rejected promise instead of a pending
          // request that silently waits for the denied webview.
          try {
            Object.defineProperty(window, "fetch", {
              value: () => {
                throw new Error("Extension sandbox has no network access");
              },
              writable: false,
              configurable: false,
              enumerable: true,
            });
          } catch {
            // The CSP already blocks every fetch source in this document.
          }
          try {
            Object.defineProperty(window, "close", {
              value: deny,
              writable: false,
              configurable: false,
              enumerable: true,
            });
          } catch {
            // Closing the sandbox is never part of the package contract.
          }
        }

        shieldHostIpc();

        /** Returns a readable message for any thrown value. */
        function messageOf(error) {
          return error instanceof Error ? error.message : String(error);
        }

        /** Serializes an error for a cell result. */
        function errorOf(error) {
          return {
            name: error instanceof Error ? error.name : "Error",
            message: messageOf(error),
            stack:
              error instanceof Error && typeof error.stack === "string" ? error.stack : undefined,
          };
        }

        /** Reports a failure to the host unless the sandbox is already disposed. */
        function fail(error, action) {
          if (disposed) {
            return;
          }
          try {
            port?.postMessage({
              type: "failure",
              action,
              error: messageOf(error),
            });
          } catch {
            // A closed bridge means the host is already tearing this sandbox down.
          }
        }

        /** Reports and blocks one package navigation attempt. */
        function denyNavigation() {
          fail(new Error("Extension sandbox cannot navigate"), "sandbox.navigate");
        }

        /**
         * Blocks package-initiated navigation before it can leave the frame.
         *
         * `connect-src` does not cover navigation, and a sandboxed document may
         * still navigate itself. The Navigation API observes the navigation
         * before the request; Location, anchor, and form patches are a
         * best-effort fallback for hosts without it. The host still removes the
         * iframe on an unexpected load as the final backstop.
         */
        function guardNavigation() {
          try {
            globalThis.navigation?.addEventListener("navigate", (event) => {
              if (event.cancelable !== false) {
                event.preventDefault();
              }
              denyNavigation();
            });
          } catch {
            // A host without the Navigation API keeps the fallback guards.
          }
          /** Replaces one navigation method with a denial. */
          const denyMethod = (target, name) => {
            try {
              const descriptor = Object.getOwnPropertyDescriptor(target, name);
              if (descriptor && descriptor.configurable === false) {
                return;
              }
              Object.defineProperty(target, name, {
                configurable: false,
                writable: false,
                value: () => {
                  denyNavigation();
                  throw new Error("Extension sandbox cannot navigate");
                },
              });
            } catch {
              // A non-configurable member keeps its host implementation.
            }
          };
          const locationPrototype = globalThis.Location?.prototype;
          if (locationPrototype) {
            denyMethod(locationPrototype, "assign");
            denyMethod(locationPrototype, "replace");
            for (const name of [
              "href",
              "protocol",
              "host",
              "hostname",
              "port",
              "pathname",
              "search",
            ]) {
              try {
                const descriptor = Object.getOwnPropertyDescriptor(locationPrototype, name);
                if (!descriptor?.set || descriptor.configurable === false) {
                  continue;
                }
                Object.defineProperty(locationPrototype, name, {
                  configurable: false,
                  enumerable: descriptor.enumerable,
                  get: descriptor.get,
                  set: () => {
                    denyNavigation();
                    throw new Error("Extension sandbox cannot navigate");
                  },
                });
              } catch {
                // Leave a host-defined setter in place.
              }
            }
          }
          if (globalThis.HTMLAnchorElement) {
            denyMethod(globalThis.HTMLAnchorElement.prototype, "click");
          }
          if (globalThis.HTMLFormElement) {
            denyMethod(globalThis.HTMLFormElement.prototype, "submit");
            denyMethod(globalThis.HTMLFormElement.prototype, "requestSubmit");
          }
        }

        guardNavigation();

        /** Reports a failing Extension cleanup to the host. */
        function reportCleanupFailure(error) {
          fail(error, "cleanup");
        }

        /** Stores a callback for host invocation and returns its bridge id. */
        function registerCallback(callback) {
          const id = nextId++;
          callbacks.set(id, callback);
          return id;
        }

        function dropCallback(id) {
          callbacks.delete(id);
        }

        /** Posts a message to the host unless the sandbox is disposed or disconnected. */
        function send(message) {
          if (disposed) {
            return;
          }
          try {
            port?.postMessage(message);
          } catch (error) {
            fail(error, "bridge.send");
          }
        }

        /** Converts callbacks and byte arrays into bridge-safe values. */
        function encode(value) {
          if (typeof value === "function") {
            return { __callback: registerCallback(value) };
          }
          if (value instanceof Uint8Array) {
            return { __bytes: Array.from(value) };
          }
          if (Array.isArray(value)) {
            return value.map(encode);
          }
          if (value && typeof value === "object") {
            const encoded = {};
            for (const [key, entry] of Object.entries(value)) {
              encoded[key] = encode(entry);
            }
            return encoded;
          }
          return value;
        }

        /** Returns an idempotent disposer that releases one host handle. */
        function makeDisposer(id) {
          let active = true;
          return () => {
            if (!active || disposed) {
              return;
            }
            active = false;
            send({ type: "dispose-handle", id });
          };
        }

        /** Builds the asynchronous proxy for one host value handle. */
        function makeValueHandle(bridgeId, id) {
          return Object.freeze({
            id: typeof id === "string" ? id : "",
            get: () => rpc("values.get", [bridgeId]),
            set: (value) => rpc("values.set", [bridgeId, value]),
            update: (partial) => rpc("values.update", [bridgeId, partial]),
            subscribe: (listener) => rpc("values.subscribe", [bridgeId, listener]),
            subscribeKey: (listener) => rpc("values.subscribe", [bridgeId, listener]),
          });
        }

        /** Restores byte arrays, value handles, and disposers from bridge values. */
        function decode(value) {
          if (Array.isArray(value)) {
            return value.map(decode);
          }
          if (value && typeof value === "object") {
            if (Array.isArray(value.__bytes)) {
              return new Uint8Array(value.__bytes);
            }
            if (typeof value.__valueHandle === "string") {
              return makeValueHandle(value.__valueHandle, value.id);
            }
            if (typeof value.__disposer === "string") {
              return makeDisposer(value.__disposer);
            }
            const decoded = {};
            for (const [key, entry] of Object.entries(value)) {
              decoded[key] = decode(entry);
            }
            return decoded;
          }
          return value;
        }

        /** Sends one request to the host and resolves with its decoded result. */
        function rpc(method, args) {
          if (disposed) {
            return Promise.reject(new Error("Extension sandbox is disposed"));
          }
          if (!port) {
            return Promise.reject(new Error("Extension sandbox is not connected"));
          }
          const id = nextId++;
          return new Promise((resolve, reject) => {
            pending.set(id, { resolve, reject });
            port.postMessage({ type: "rpc", id, method, args: encode(args) });
          });
        }

        /** Sends a one-way notification to the host. */
        function notify(method, args) {
          if (disposed || !port) {
            return;
          }
          try {
            port.postMessage({ type: "notify", method, args: encode(args) });
          } catch (error) {
            fail(error, method);
          }
        }

        /** Fills {name} placeholders, leaving unknown names intact. */
        function interpolate(text, params) {
          if (!params) {
            return text;
          }
          return String(text).replace(/\{(\w+)\}/g, (whole, name) =>
            Object.prototype.hasOwnProperty.call(params, name) ? String(params[name]) : whole,
          );
        }

        /** Builds the translator used by package code from the message catalogs. */
        function makeI18n(translations, language) {
          const catalog = translations?.[language] ?? {};
          const fallback = translations?.en ?? {};
          const text = (value) => {
            if (typeof value === "string") {
              return value;
            }
            const resolved = catalog[value.key] ?? fallback[value.key] ?? value.key;
            return interpolate(resolved, value.params);
          };
          return {
            language: () => language,
            t: (key, params) => interpolate(catalog[key] ?? fallback[key] ?? key, params),
            key: (value) => (typeof value === "string" ? value : value.key),
            text,
          };
        }

        /** Builds the proxy that turns property paths and calls into host RPCs. */
        function makeApi(path) {
          const target = (...args) => rpc("api.call", [path, args]);
          return new Proxy(target, {
            get(_target, property) {
              if (typeof property !== "string") {
                return undefined;
              }
              if (path.length === 0 && property === "version") {
                return payload?.version ?? "";
              }
              if (
                property === "then" ||
                property === "toJSON" ||
                property === "constructor" ||
                property === "prototype" ||
                property === "__proto__"
              ) {
                return undefined;
              }
              return makeApi([...path, property]);
            },
            apply(_target, _thisArg, args) {
              return rpc("api.call", [path, args]);
            },
          });
        }

        /** Builds a store handle for settings or storage. */
        function makeStore(kind) {
          return {
            get: (key) => rpc("store.get", [kind, key]),
            set: (key, value) => rpc("store.set", [kind, key, value]),
            delete: (key) => rpc("store.delete", [kind, key]),
            clear: () => rpc("store.clear", [kind]),
          };
        }

        /** Adds JSON storage helpers over the same owner-scoped string entries. */
        function makeJsonStore(store) {
          return {
            ...store,
            getJSON: (key) => rpc("store.getJSON", ["storage", key]),
            setJSON: (key, value) => rpc("store.setJSON", ["storage", key, value]),
          };
        }

        /** Registers a panel or overlay and returns its update and dispose handle. */
        function surfaceHandle(kind, definition) {
          const localId = `${kind}:${nextId++}`;
          const eventId =
            typeof definition.onEvent === "function"
              ? registerCallback(definition.onEvent)
              : undefined;
          const request = {
            id: definition.id,
            tree: definition.tree,
            eventId,
            ...(kind === "overlay" ? { order: definition.order, scope: definition.scope } : {}),
          };
          const method = kind === "panel" ? "ui.registerPanel" : "ui.registerOverlay";
          void rpc(method, [{ surfaceId: localId, definition: request }]).catch((error) =>
            fail(error, method),
          );
          return {
            update(tree, options) {
              notify("ui.update", [
                { surfaceId: localId, tree, replace: options?.replace === true },
              ]);
            },
            dispose() {
              void rpc("ui.remove", [{ surfaceId: localId }]).catch((error) =>
                fail(error, "ui.remove"),
              );
            },
          };
        }

        /** Builds the UI facade exposed to package code. */
        function makeUi() {
          return {
            notice(message, options) {
              notify("ui.notice", [message, options]);
            },
            confirm: (message) => rpc("ui.confirm", [message]),
            input: (options) => rpc("ui.input", [options]),
            select: (options) => rpc("ui.select", [options]),
            guide: (options) => rpc("ui.guide", [options]),
            progress(title, totalSteps) {
              const registration = rpc("ui.progress", [title, totalSteps]);
              return {
                update(message, options) {
                  void registration
                    .then((id) => rpc("ui.progress.update", [id, message, options]))
                    .catch((error) => fail(error, "ui.progress.update"));
                },
                close() {
                  void registration
                    .then((id) => rpc("ui.progress.close", [id]))
                    .catch((error) => fail(error, "ui.progress.close"));
                },
              };
            },
            pickImage: (options) => rpc("ui.pickImage", [options]),
            designCatalog: () => rpc("ui.designCatalog", []),
            registerDesignPanel(definition) {
              const localId = `design-panel:${nextId++}`;
              const eventId =
                typeof definition.onEvent === "function"
                  ? registerCallback(definition.onEvent)
                  : undefined;
              void rpc("ui.registerDesignPanel", [
                {
                  surfaceId: localId,
                  definition: {
                    id: definition.id,
                    slot: definition.slot,
                    component: definition.component,
                    eventId,
                  },
                },
              ]).catch((error) => fail(error, "ui.registerDesignPanel"));
              return makeDisposer(localId);
            },
            registerPanel: (definition) => surfaceHandle("panel", definition),
            registerOverlay: (definition) => surfaceHandle("overlay", definition),
            registerSidebar(definition) {
              const localId = `sidebar:${nextId++}`;
              void rpc("ui.registerSidebar", [{ surfaceId: localId, definition }]).catch((error) =>
                fail(error, "ui.registerSidebar"),
              );
              return makeDisposer(localId);
            },
          };
        }

        /** Wraps a timer callback so a thrown error becomes a bridge failure. */
        function guardedTimer(action, callback) {
          return (...args) => {
            try {
              callback(...args);
            } catch (error) {
              fail(error, action);
            }
          };
        }

        /** Returns the shared live-handle count for timers created by any context. */
        function timerCount() {
          return timeouts.size + intervals.size + animationFrames.size;
        }

        /** Clamps an interval to the host-provided minimum and the timer ceiling. */
        function clampInterval(delay, minimum) {
          return Number.isFinite(delay)
            ? Math.max(minimum, Math.min(delay, 2_147_483_647))
            : minimum;
        }

        /** Drops one local timer entry and its bridge callback. */
        function dropTimer(entries, handle) {
          const entry = entries.get(handle);
          if (!entry) {
            return null;
          }
          entries.delete(handle);
          dropCallback(entry.callbackId);
          return entry;
        }

        /** Clears a local timer and its host-side registration when it exists. */
        function clearTimer(entries, handle, method, action) {
          const entry = dropTimer(entries, handle);
          if (!entry) {
            return;
          }
          entry.cancelled = true;
          if (entry.hostHandle !== null) {
            void rpc(method, [entry.hostHandle]).catch((error) => fail(error, action));
          }
        }

        /** Schedules one host-backed timer and returns its synchronous local handle. */
        function scheduleTimer(
          entries,
          method,
          clearMethod,
          action,
          callback,
          delay,
          kind,
          maximum,
          minimum,
        ) {
          if (timerCount() >= maximum) {
            throw new Error(`Extension timer limit reached: ${maximum}`);
          }
          const handle = nextTimerId++;
          let callbackId = 0;
          callbackId = registerCallback((...args) => {
            if (kind !== "interval") {
              entries.delete(handle);
              dropCallback(callbackId);
            }
            guardedTimer(action, callback)(...args);
          });
          const entry = { callbackId, hostHandle: null, cancelled: false };
          entries.set(handle, entry);
          const args =
            kind === "interval"
              ? [{ __callback: callbackId }, clampInterval(delay, minimum)]
              : kind === "timeout"
                ? [{ __callback: callbackId }, delay]
                : [{ __callback: callbackId }];
          void rpc(method, args).then(
            (hostHandle) => {
              entry.hostHandle = typeof hostHandle === "number" ? hostHandle : null;
              if (entry.cancelled && entry.hostHandle !== null) {
                void rpc(clearMethod, [entry.hostHandle]).catch((error) => fail(error, action));
              }
            },
            (error) => {
              if (entry.cancelled) {
                return;
              }
              entry.cancelled = true;
              entries.delete(handle);
              dropCallback(callbackId);
              fail(error, action);
            },
          );
          return handle;
        }

        /** Builds the host-backed timer façade or the denial façade. */
        function makeTimers(message) {
          const granted = new Set(message.capabilities ?? []);
          const denyTimer = () => {
            throw new Error("Extension capability denied: timers");
          };
          const denied = () => ({
            setTimeout: denyTimer,
            setInterval: denyTimer,
            requestAnimationFrame: denyTimer,
            clearTimeout: denyTimer,
            clearInterval: denyTimer,
            cancelAnimationFrame: denyTimer,
          });
          if (!granted.has("timers")) {
            return denied();
          }
          // The host owns the live-handle budget and interval floor; a load
          // without valid limits fails closed instead of inventing its own.
          const limits = message.limits ?? {};
          const maximum = limits.maxTimers;
          const minimum = limits.minIntervalMs;
          if (
            !Number.isSafeInteger(maximum) ||
            maximum <= 0 ||
            !Number.isFinite(minimum) ||
            minimum < 0
          ) {
            return denied();
          }
          return {
            setTimeout: (callback, delay) =>
              scheduleTimer(
                timeouts,
                "timers.setTimeout",
                "timers.clearTimeout",
                "timers.setTimeout",
                callback,
                delay,
                "timeout",
                maximum,
                minimum,
              ),
            setInterval: (callback, delay) =>
              scheduleTimer(
                intervals,
                "timers.setInterval",
                "timers.clearInterval",
                "timers.setInterval",
                callback,
                delay,
                "interval",
                maximum,
                minimum,
              ),
            requestAnimationFrame: (callback) =>
              scheduleTimer(
                animationFrames,
                "timers.requestAnimationFrame",
                "timers.cancelAnimationFrame",
                "timers.requestAnimationFrame",
                callback,
                undefined,
                "frame",
                maximum,
                minimum,
              ),
            clearTimeout: (handle) =>
              clearTimer(timeouts, handle, "timers.clearTimeout", "timers.clearTimeout"),
            clearInterval: (handle) =>
              clearTimer(intervals, handle, "timers.clearInterval", "timers.clearInterval"),
            cancelAnimationFrame: (handle) =>
              clearTimer(
                animationFrames,
                handle,
                "timers.cancelAnimationFrame",
                "timers.cancelAnimationFrame",
              ),
          };
        }

        /**
         * Blocks iframe globals that Extension code must use through the context
         * instead: timers, nested workers, and script loading.
         */
        function shieldExtensionGlobals(granted) {
          const denyTimer = () => {
            throw new Error(
              granted
                ? "Global timers are not available inside the Extension sandbox; use context.timers"
                : "Extension capability denied: timers",
            );
          };
          const denyWorker = () => {
            throw new Error("Extension workers are not available inside the sandbox");
          };
          const holders = [];
          let holder = globalThis;
          while (holder && holder !== Object.prototype) {
            holders.push(holder);
            holder = Object.getPrototypeOf(holder);
          }
          const shield = (names, deny) => {
            for (const name of names) {
              for (const target of holders) {
                try {
                  Object.defineProperty(target, name, {
                    configurable: false,
                    writable: false,
                    value: deny,
                  });
                } catch {
                  try {
                    target[name] = deny;
                  } catch {
                    // A host-defined non-writable property stays as it is.
                  }
                }
              }
            }
          };
          shield(
            [
              "setTimeout",
              "setInterval",
              "setImmediate",
              "requestAnimationFrame",
              "clearTimeout",
              "clearInterval",
              "cancelAnimationFrame",
            ],
            denyTimer,
          );
          shield(["Worker", "SharedWorker", "importScripts"], denyWorker);
          /**
           * Builds a denial that is usable both as a call and as a constructor,
           * so `new RTCPeerConnection()` reaches the normal unavailable error.
           */
          const denyWebApi = (name) =>
            function unavailableApi() {
              throw new Error(`${name} is not available in the Extension sandbox`);
            };
          for (const name of DENIED_WEBRTC_GLOBALS) {
            shield([name], denyWebApi(name));
          }
          // `mediaDevices` is an accessor on Navigator.prototype, so its
          // replacement has to throw from a getter. Both the prototype and the
          // live navigator object are patched; the descriptors stay
          // non-configurable so package code cannot restore the host member.
          const navigatorPrototype = globalThis.Navigator?.prototype;
          const navigatorObject = globalThis.navigator;
          for (const name of DENIED_NAVIGATOR_MEMBERS) {
            const deny = denyWebApi(`navigator.${name}`);
            const descriptor = navigatorPrototype
              ? Object.getOwnPropertyDescriptor(navigatorPrototype, name)
              : undefined;
            const definition =
              name === "mediaDevices"
                ? {
                    configurable: false,
                    enumerable: descriptor?.enumerable ?? true,
                    get: deny,
                  }
                : {
                    configurable: false,
                    writable: false,
                    value: deny,
                  };
            for (const target of [navigatorPrototype, navigatorObject]) {
              if (!target) {
                continue;
              }
              try {
                Object.defineProperty(target, name, definition);
              } catch {
                try {
                  target[name] = deny;
                } catch {
                  // A host-defined non-configurable member stays as it is.
                }
              }
            }
          }
        }

        /** Builds the context for an Extension activation. */
        function makeContext(message) {
          const ui = makeUi();
          const api = makeApi([]);
          const i18n = makeI18n(message.translations, message.language);
          const timers = makeTimers(message);
          const context = {
            manifest: message.manifest,
            signal: controller.signal,
            api,
            i18n,
            ui,
            events: {
              on(name, callback, priority) {
                const localId = `event:${nextId++}`;
                const callbackId = registerCallback(callback);
                void rpc("events.on", [localId, name, callbackId, priority ?? 0]).catch((error) =>
                  fail(error, `events.${name}`),
                );
                return makeDisposer(localId);
              },
            },
            hooks: {
              register(name, callback, schema, priority) {
                const localId = `hook:${nextId++}`;
                const callbackId = registerCallback(callback);
                void rpc("hooks.register", [
                  localId,
                  name,
                  callbackId,
                  priority ?? 0,
                  schema,
                ]).catch((error) => fail(error, `hooks.${name}`));
                return makeDisposer(localId);
              },
              invoke(name, payload, options) {
                return rpc("hooks.invoke", [name, payload, options ?? {}]);
              },
            },
            scripts: {
              register(definition) {
                const localId = `script:${nextId++}`;
                const runId =
                  typeof definition.run === "function" ? registerCallback(definition.run) : null;
                void rpc("scripts.register", [
                  localId,
                  {
                    id: definition.id,
                    label: definition.label,
                    description: definition.description,
                    icon: definition.icon,
                    defaultShortcuts: definition.defaultShortcuts,
                    parameters: definition.parameters,
                    steps: definition.steps,
                    runId,
                  },
                ]).catch((error) => fail(error, "scripts.register"));
                return makeDisposer(localId);
              },
            },
            settings: makeStore("settings"),
            storage: makeJsonStore(makeStore("storage")),
            timers,
            styles: {
              add(cssText) {
                const localId = `style:${nextId++}`;
                void rpc("styles.add", [localId, cssText]).catch((error) =>
                  fail(error, "styles.add"),
                );
                return makeDisposer(localId);
              },
            },
            services: {
              provide(definition) {
                const localId = `service:${nextId++}`;
                const methodIds = {};
                for (const [name, method] of Object.entries(definition.methods ?? {})) {
                  if (typeof method !== "function") {
                    throw new Error(`Extension service method is not callable: ${name}`);
                  }
                  methodIds[name] = registerCallback(method);
                }
                void rpc("services.provide", [
                  localId,
                  { id: definition.id, version: definition.version },
                  methodIds,
                ]).catch((error) => fail(error, "services.provide"));
                return makeDisposer(localId);
              },
              resolve(id, version) {
                return rpc("services.resolve", [id, version]);
              },
              call(id, method, args) {
                return rpc("services.call", [id, method, args ?? []]);
              },
              onChange(id, listener) {
                const localId = `service-listener:${nextId++}`;
                const callbackId = registerCallback(listener);
                void rpc("services.onChange", [localId, id, callbackId]).catch((error) =>
                  fail(error, "services.onChange"),
                );
                return makeDisposer(localId);
              },
              provideData(definition) {
                const localId = `data-provider:${nextId++}`;
                void rpc("services.provideData", [
                  localId,
                  {
                    id: definition.id,
                    version: definition.version,
                    initial: encode(definition.initial),
                  },
                ]).catch((error) => fail(error, "services.provideData"));
                return makeDisposer(localId);
              },
              readData(id, version) {
                return rpc("services.readData", [id, version]);
              },
              updateData(id, value) {
                return rpc("services.updateData", [id, encode(value)]);
              },
              onDataChange(id, listener) {
                const localId = `data-listener:${nextId++}`;
                const callbackId = registerCallback(listener);
                void rpc("services.onDataChange", [localId, id, callbackId]).catch((error) =>
                  fail(error, "services.onDataChange"),
                );
                return makeDisposer(localId);
              },
            },
            addCleanup(cleanup) {
              cleanups.add(cleanup);
              return () => cleanups.delete(cleanup);
            },
          };
          Object.defineProperty(context, "listeners", {
            get() {
              throw new Error("Extension DOM listeners are not available in the sandbox");
            },
          });
          return context;
        }

        /** Clamps the host-provided cell budget to the sandbox contract. */
        function cellTimeoutOf(message) {
          if (typeof message.timeoutMs !== "number" || !Number.isFinite(message.timeoutMs)) {
            return CELL_TIMEOUT_DEFAULT_MS;
          }
          return Math.min(CELL_TIMEOUT_MAX_MS, Math.max(1_000, Math.round(message.timeoutMs)));
        }

        /** Maps worker callback markers onto iframe callbacks that post back to the worker. */
        function remapCellCallbacks(value) {
          if (Array.isArray(value)) {
            return value.map(remapCellCallbacks);
          }
          if (value && typeof value === "object") {
            if (typeof value.__callback === "number") {
              const workerId = value.__callback;
              let hostId = cellCallbackIds.get(workerId);
              if (hostId === undefined) {
                hostId = registerCallback((...args) => {
                  cellWorker?.postMessage({ type: "cell-callback", id: workerId, args });
                });
                cellCallbackIds.set(workerId, hostId);
              }
              return { __callback: hostId };
            }
            if (Array.isArray(value.__bytes)) {
              return value;
            }
            const remapped = {};
            for (const [key, entry] of Object.entries(value)) {
              remapped[key] = remapCellCallbacks(entry);
            }
            return remapped;
          }
          return value;
        }

        /** Answers one worker RPC request with a local bridge error. */
        function replyCellRpc(id, error) {
          if (typeof id !== "number" || !cellWorker) {
            return;
          }
          try {
            cellWorker.postMessage({
              type: "cell-rpc-result",
              id,
              ok: false,
              error: { message: messageOf(error) },
            });
          } catch {
            // A terminated worker has nobody left to answer.
          }
        }

        /** Forwards one worker RPC request to the capability-gated host port. */
        function relayCellRpc(message) {
          if (typeof message.id !== "number") {
            return;
          }
          if (!port || disposed || cellFinished) {
            replyCellRpc(message.id, new Error("Extension sandbox is not connected"));
            return;
          }
          const hostId = nextId++;
          cellPending.set(hostId, message.id);
          let args;
          try {
            args = remapCellCallbacks(message.args);
          } catch (error) {
            cellPending.delete(hostId);
            replyCellRpc(message.id, error);
            return;
          }
          try {
            port.postMessage({
              type: "rpc",
              id: hostId,
              method: String(message.method ?? ""),
              args,
            });
          } catch (error) {
            cellPending.delete(hostId);
            replyCellRpc(message.id, error);
          }
        }

        /** Stops the cell worker and releases every handle created for it. */
        function stopCellWorker() {
          if (cellWorkerTimer) {
            nativeClearTimeout(cellWorkerTimer);
            cellWorkerTimer = 0;
          }
          const worker = cellWorker;
          cellWorker = null;
          if (worker) {
            worker.onmessage = null;
            worker.onerror = null;
            worker.onmessageerror = null;
            try {
              worker.terminate();
            } catch {
              // A worker that already exited needs no further teardown.
            }
          }
          if (cellWorkerUrl) {
            URL.revokeObjectURL(cellWorkerUrl);
            cellWorkerUrl = "";
          }
          if (cellSourceUrl) {
            URL.revokeObjectURL(cellSourceUrl);
            cellSourceUrl = "";
          }
          for (const id of cellCallbackIds.values()) {
            dropCallback(id);
          }
          cellCallbackIds.clear();
          cellPending.clear();
        }

        /** Sends the one final cell result to the host and stops the worker. */
        function settleCell(message) {
          if (cellFinished) {
            return;
          }
          cellFinished = true;
          const ok = message.ok === true;
          const logs = Array.isArray(message.logs) ? message.logs : cellLogs;
          const error =
            !ok && message.error && typeof message.error === "object" ? message.error : undefined;
          const durationMs =
            typeof message.durationMs === "number"
              ? message.durationMs
              : Math.round(performance.now() - cellStartedAt);
          stopCellWorker();
          send({
            type: "cell-result",
            ok,
            ...(ok ? { value: message.value } : {}),
            logs,
            ...(error ? { error } : {}),
            durationMs,
            truncated: message.truncated === true,
          });
        }

        /** Reports a cell failure that happened before the worker produced a result. */
        function failCell(error) {
          if (cellFinished) {
            return;
          }
          cellFinished = true;
          stopCellWorker();
          send({
            type: "cell-result",
            ok: false,
            error: errorOf(error),
            logs: cellLogs,
            durationMs: Math.round(performance.now() - cellStartedAt),
            truncated: false,
          });
        }

        /** Terminates a cell that missed its deadline and reports the timeout. */
        function timeoutCell(timeoutMs) {
          if (cellFinished) {
            return;
          }
          cellFinished = true;
          stopCellWorker();
          send({
            type: "cell-result",
            ok: false,
            logs: cellLogs,
            error: {
              name: "TimeoutError",
              message: `Code cell execution timed out after ${timeoutMs} ms`,
            },
            durationMs: timeoutMs,
            truncated: true,
          });
        }

        /** Handles one bridge message from the cell worker. */
        function onCellWorkerMessage(event) {
          const message = event.data;
          if (!message || typeof message !== "object") {
            return;
          }
          if (message.type === "cell-rpc") {
            relayCellRpc(message);
            return;
          }
          if (message.type === "cell-dispose-handle") {
            send({ type: "dispose-handle", id: message.id });
            return;
          }
          if (message.type === "cell-failure") {
            fail(
              new Error(messageOf(message.error)),
              typeof message.action === "string" ? message.action : "cell",
            );
            return;
          }
          if (message.type === "cell-log") {
            if (cellFinished) {
              return;
            }
            const log = message.log;
            if (
              !log ||
              typeof log !== "object" ||
              typeof log.text !== "string" ||
              cellLogs.length >= CELL_LOG_LIMIT
            ) {
              return;
            }
            const entry = {
              level:
                log.level === "info" || log.level === "warn" || log.level === "error"
                  ? log.level
                  : "log",
              text: log.text,
              atMs: typeof log.atMs === "number" ? log.atMs : 0,
            };
            cellLogs.push(entry);
            send({ type: "cell-log", log: entry });
            return;
          }
          if (message.type === "cell-result") {
            settleCell(message);
          }
        }

        /** Handles an uncaught error that prevents the worker from reporting a result. */
        function onCellWorkerError(event) {
          event.preventDefault();
          const error =
            event.error instanceof Error
              ? event.error
              : new Error(
                  typeof event.message === "string" && event.message
                    ? event.message
                    : "Code cell worker failed",
                );
          failCell(error);
        }

        /** Starts one cell in a dedicated classic worker and arms its deadline. */
        function loadCell(message) {
          cellFinished = false;
          cellLogs = [];
          cellPending.clear();
          cellCallbackIds.clear();
          cellStartedAt = performance.now();
          const timeoutMs = cellTimeoutOf(message);
          if (typeof message.workerSource !== "string" || !message.workerSource) {
            failCell(new Error("Code cell worker source is unavailable"));
            return;
          }
          if (typeof message.source !== "string" || !message.source) {
            failCell(new Error("Code cell source is unavailable"));
            return;
          }
          try {
            cellWorkerUrl = URL.createObjectURL(
              new Blob([message.workerSource], { type: "text/javascript" }),
            );
            cellSourceUrl = URL.createObjectURL(
              new Blob([message.source], { type: "text/javascript" }),
            );
          } catch (error) {
            failCell(error);
            return;
          }
          try {
            // A module worker cannot be created in the opaque origin, so the
            // bootstrap is classic and dynamically imports the cell module.
            cellWorker = new Worker(cellWorkerUrl);
          } catch (error) {
            failCell(error);
            return;
          }
          cellWorker.onmessage = onCellWorkerMessage;
          cellWorker.onerror = onCellWorkerError;
          cellWorker.onmessageerror = () =>
            failCell(new Error("Code cell worker message could not be decoded"));
          cellWorkerTimer = nativeSetTimeout(() => timeoutCell(timeoutMs), timeoutMs);
          try {
            cellWorker.postMessage({
              type: "cell-init",
              sourceUrl: cellSourceUrl,
              manifest: message.manifest,
              input: message.input,
              version: message.version,
            });
          } catch (error) {
            failCell(error);
          }
        }

        /** Imports the package module, runs activate, and reports the result. */
        async function load(message) {
          payload = message;
          if (message.mode === "cell") {
            loadCell(message);
            return;
          }
          shieldExtensionGlobals((message.capabilities ?? []).includes("timers"));
          const source = URL.createObjectURL(
            new Blob([message.source], { type: "text/javascript" }),
          );
          try {
            const module = await import(source);
            // `module.mod` keeps older installed packages loadable.
            const definition = module.default ?? module.extension ?? module.mod;
            if (!definition || typeof definition.activate !== "function") {
              throw new Error("Extension entry must export a default definition with activate");
            }
            const context = makeContext(message);
            await definition.activate(context);
            send({ type: "loaded", ok: true });
          } catch (error) {
            send({ type: "loaded", ok: false, error: messageOf(error) });
          } finally {
            URL.revokeObjectURL(source);
          }
        }

        /** Runs cleanups in reverse order, rejects pending calls, and closes the port. */
        function dispose() {
          if (disposed) {
            return;
          }
          disposed = true;
          stopCellWorker();
          for (const cleanup of [...cleanups].reverse()) {
            try {
              cleanup();
            } catch (error) {
              reportCleanupFailure(error);
            }
          }
          cleanups.clear();
          callbacks.clear();
          controller.abort();
          for (const { reject } of pending.values()) {
            reject(new Error("Extension sandbox was disposed"));
          }
          pending.clear();
          try {
            port?.close();
          } catch {
            // Closing a port the host already closed throws; teardown continues either way.
          }
          port = null;
        }

        /** Handles load, RPC results, callbacks, script runs, and dispose from the host. */
        function onPortMessage(event) {
          const message = event.data;
          if (!message || typeof message !== "object") {
            return;
          }
          if (message.type === "load") {
            void load(message);
            return;
          }
          if (message.type === "rpc-result") {
            if (typeof message.id === "number" && cellPending.has(message.id)) {
              const workerId = cellPending.get(message.id);
              cellPending.delete(message.id);
              try {
                cellWorker?.postMessage({
                  type: "cell-rpc-result",
                  id: workerId,
                  ok: message.ok === true,
                  ...(message.ok === true ? { value: message.value } : { error: message.error }),
                });
              } catch {
                // The worker already ended; its pending promise no longer matters.
              }
              return;
            }
            const request = pending.get(message.id);
            if (!request) {
              return;
            }
            pending.delete(message.id);
            if (message.ok) {
              request.resolve(decode(message.value));
            } else {
              const error = new Error(String(message.error?.message ?? "Extension bridge failed"));
              if (message.error?.code) {
                error.code = message.error.code;
              }
              request.reject(error);
            }
            return;
          }
          if (message.type === "callback") {
            const callback = callbacks.get(message.id);
            if (!callback) {
              return;
            }
            try {
              const result = callback(...(Array.isArray(message.args) ? message.args : []));
              if (message.requestId !== undefined) {
                Promise.resolve(result).then(
                  (value) =>
                    send({
                      type: "callback-result",
                      requestId: message.requestId,
                      ok: true,
                      value: encode(value),
                    }),
                  (error) =>
                    send({
                      type: "callback-result",
                      requestId: message.requestId,
                      ok: false,
                      error: { message: String(error?.message ?? error) },
                    }),
                );
              } else if (result && typeof result.then === "function") {
                result.catch((error) => fail(error, "callback.promise"));
              }
            } catch (error) {
              fail(error, "callback");
            }
            return;
          }
          if (message.type === "hook-call") {
            const callback = callbacks.get(message.callbackId);
            const requestId = message.requestId;
            if (!callback || typeof requestId !== "number") {
              return;
            }
            Promise.resolve()
              .then(() => callback(message.payload))
              .then(
                (value) => send({ type: "hook-result", requestId, ok: true, value: encode(value) }),
                (error) =>
                  send({
                    type: "hook-result",
                    requestId,
                    ok: false,
                    error: messageOf(error),
                  }),
              );
            return;
          }
          if (message.type === "script-run") {
            const run = callbacks.get(message.runId);
            const context = makeContext(payload);
            const scriptContext = {
              manifest: payload.manifest,
              signal: controller.signal,
              api: context.api,
              i18n: context.i18n,
              params: message.params ?? {},
              ui: context.ui,
            };
            Promise.resolve()
              .then(() => {
                if (!run) {
                  throw new Error("Extension script is no longer registered");
                }
                return run(scriptContext);
              })
              .then(
                () =>
                  send({
                    type: "script-result",
                    requestId: message.requestId,
                    ok: true,
                  }),
                (error) =>
                  send({
                    type: "script-result",
                    requestId: message.requestId,
                    ok: false,
                    error: messageOf(error),
                  }),
              );
            return;
          }
          if (message.type === "dispose") {
            dispose();
          }
        }

        /** Binds the host's init message port, which connects this sandbox. */
        function onWindowMessage(event) {
          if (event.source !== window.parent) {
            return;
          }
          const message = event.data;
          if (!message || message.type !== "redux-sandbox-init" || message.token !== token) {
            return;
          }
          if (port || !event.ports?.[0]) {
            return;
          }
          port = event.ports[0];
          port.onmessage = onPortMessage;
          port.start?.();
          window.removeEventListener("message", onWindowMessage);
        }

        window.addEventListener("message", onWindowMessage);
        window.addEventListener("error", (event) =>
          fail(event.error ?? event.message, "sandbox.error"),
        );
        window.addEventListener("unhandledrejection", (event) =>
          fail(event.reason, "sandbox.promise"),
        );
        window.parent.postMessage({ type: "redux-sandbox-ready", token }, "*");
      })();
    </script>
  </body>
</html>
