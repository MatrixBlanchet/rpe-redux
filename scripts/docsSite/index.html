<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1318" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:," />
    <title>{{SITE_TITLE}}</title>
    <meta name="description" content="{{SITE_DESCRIPTION}}" />
    <link rel="stylesheet" href="/docs/assets/app.css" />
    <script src="/docs/assets/app.js" defer></script>
  </head>
  <body data-docs-shell>
    <a class="docs-skip" href="#docs-content" data-docs-i18n="skip">跳到正文</a>
    <header class="docs-topbar">
      <button
        id="docs-menu-toggle"
        class="docs-menu-toggle"
        type="button"
        aria-label="打开导航"
        aria-controls="docs-sidebar"
        aria-expanded="false"
      >
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </button>
      <a class="docs-brand" href="/docs/{{FIRST_ROUTE}}" data-route="{{FIRST_ROUTE}}">
        <img
          class="docs-brand-mark"
          src="/docs/assets/brand.png"
          alt=""
          width="30"
          height="30"
          decoding="async"
        />
        <span class="docs-brand-copy">
          <strong>RPE Redux</strong>
          <small>扩展开发文档</small>
        </span>
      </a>
      <div class="docs-search">
        <label class="docs-visually-hidden" for="docs-search">搜索文档</label>
        <input
          id="docs-search"
          type="search"
          placeholder="搜索文档…"
          autocomplete="off"
          spellcheck="false"
          aria-controls="docs-search-results"
          aria-expanded="false"
        />
        <kbd aria-hidden="true">Ctrl K</kbd>
        <div
          id="docs-search-results"
          class="docs-search-results"
          role="listbox"
          aria-label="搜索结果"
          hidden
        ></div>
      </div>
      <div class="docs-locale-picker">
        <button
          id="docs-locale-toggle"
          class="docs-locale-toggle"
          type="button"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-controls="docs-locale-menu"
          aria-label="选择语言"
        >
          <svg
            class="docs-locale-icon"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            aria-hidden="true"
            focusable="false"
          >
            <circle cx="12" cy="12" r="9.25" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path
              d="M2.75 12h18.5M12 2.75c2.35 2.5 3.55 5.58 3.55 9.25S14.35 18.75 12 21.25C9.65 18.75 8.45 15.67 8.45 12S9.65 5.25 12 2.75Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span id="docs-locale-current">zh</span>
          <span class="docs-locale-chevron" aria-hidden="true">⌄</span>
        </button>
        <div id="docs-locale-menu" class="docs-locale-menu" role="listbox" hidden></div>
      </div>
    </header>
    <div class="docs-progress" aria-hidden="true"><span id="docs-progress-bar"></span></div>
    <div class="docs-layout">
      <aside id="docs-sidebar" class="docs-sidebar" aria-label="文档导航">
        <nav id="docs-nav" class="docs-nav"></nav>
      </aside>
      <button
        id="docs-sidebar-backdrop"
        class="docs-sidebar-backdrop"
        type="button"
        tabindex="-1"
        aria-label="关闭导航"
        hidden
      ></button>
      <main id="docs-content" class="docs-main" tabindex="-1">
        <div id="docs-crumbs" class="docs-crumbs"></div>
        <article id="docs-article" class="docs-article" aria-live="polite"></article>
        <nav id="docs-pager" class="docs-pager" aria-label="翻页"></nav>
      </main>
      <aside id="docs-toc" class="docs-toc" aria-label="本页目录">
        <p class="docs-toc-title">本页总览</p>
        <div id="docs-toc-links" class="docs-toc-links"></div>
      </aside>
    </div>
    <div id="docs-status" class="docs-status" role="status" hidden></div>
  </body>
</html>
